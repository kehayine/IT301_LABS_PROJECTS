<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters</title>
<style>
.i {
    background-color: black;
    display: inline-block;
}

.il, .ir {
    background-color: white;
    display: inline-block;
    width: 20px;
    height: 60px;
    vertical-align: bottom;
}

.il {
    margin: 12px 10px 0px 10px;
}

.ir {
    margin: 12px 10px 0px 0px;
}


.o {
    position: relative;
    background-color: black;
    display: inline-block;
    width: 60px;
    height: 72px;
    vertical-align: top;
}

.o .oi {
    position: absolute;
    background-color: white;
    width: 30px;
    height: 42px;
    top: 15px;
    left: 15px;
}

.t {
    position: relative;
    background-color: black;
    display: inline-block;
    width: 60px;
    height: 72px;
    vertical-align: top;
}

.t .tl {
    position: absolute;
    background-color: white;
    width: 20px;
    height: 52px;
    top: 20px;
    left: 0;
}

.t .tr {
    position: absolute;
    background-color: white;
    width: 20px;
    height: 52px;
    top: 20px;
    right: 0;
}

</style>
</head>
<body>

<div class="i">
    <div class="il"></div>
    <div class="ir"></div>
</div>

<div class="o">
    <div class="oi"></div>
</div>

<div class="t">
    <div class="tl"></div>
    <div class="tr"></div>
</div>

</body>
</html>
