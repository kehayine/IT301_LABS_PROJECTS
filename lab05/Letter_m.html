<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter I</title>
<style>
.i{background-color: black;
display: inline-block;
}
.il,.ir, .ii, .ib{
    background-color: white;
    display: inline-block;
    width:20px;
    height: 60px;
    vertical-align: bottom;
    
    
}
.il{
    margin: 12px 10px 0px 10px;
}
.ir{ margin: 12px 10px  0px  0px;

}
.t {
    position: relative;
    width: 60px;
    height: 72px;
    vertical-align: top;
}
.t .ii {
    position: absolute;
    top: 0;
    left: 0;
    width: 60px;
    height: 20px;
    margin: 0;
}

.t .ib {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 20px;
    height: 52px;
    margin: 0;
}

</style>
</head>
<body>
<div class="i">
    <div class="il"></div>
    <div class="ir"></div>
</div>
<div class="i t">
    <div class="ii"></div>
    <div class="ib"></div>
</div>

</body>
</html>
