<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Layouts</title>
    <style>
        img {
            width: 100px;
            height: 100px;
        }
        div {
            display: flex;
            align-self: center;
        }
        #container {
            display: flex;
            justify-content: space-between;
        }
        #left, #right {
            display: flex;
            flex-direction: column;
            width: 300px;
        }

        #img4, #img3 {
            align-self: flex-start;
        }
        #img5, #img2 {
            align-self:center;
        }
        #img6, #img1 {
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="left">
            <img id="img1" src="https://picsum.photos/200/200?random=2" alt="Image 1">
            <img id="img2" src="https://picsum.photos/200/200?random=3" alt="Image 2: Random image 2">
            <img id="img3" src="https://picsum.photos/200/200?random=4" alt="Image 3: Random image 3">
        </div>
        <div id="right">
            <img id="img4" src="https://picsum.photos/200/200?random=8" alt="Image 4">
            <img id="img5" src="https://picsum.photos/200/200?random=9" alt="Image 5: Random image 5">
            <img id="img6" src="https://picsum.photos/200/200?random=10" alt="Image 6: Random image 6">
        </div>
    </div>
    
</body>
</html>
