<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Fun Game</title>
  <style>
  body {
    background-color: #0d0d0d;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  .gameBox {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #1c1c1c;
    padding: 30px 30px;
    border-radius: 20px;
    width: 340px;
    box-shadow: 0 0 30px rgba(255, 165, 0, 0.1);
    gap: 20px;
    transition: box-shadow 0.3s ease;
  }

  .gameBox:hover {
    box-shadow: 0 0 40px rgba(255, 165, 0, 0.2);
  }

  h2 {
    margin: 0;
    font-size: 2rem;
    color: #ffa500;
  }

  #diceBtn,
  #submit {
    font-size: 1.4rem;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    transition: background-color 0.3s, transform 0.2s;
  }

  #diceBtn {
    background-color: #ffa500;
    color: #000;
    border: none;
  }

  #diceBtn:hover {
    background-color: #ff8c00;
    cursor: pointer;
    transform: scale(1.05);
  }

  #problem {
    color: #ffa500;
    font-size: 1.3rem;
    text-align: center;
    min-height: 30px;
  }

  #userAns {
    width: 80%;
    padding: 10px;
    font-size: 1.1rem;
    border-radius: 6px;
    border: 1px solid #666;
    background-color: #2a2a2a;
    color: white;
    outline: none;
    transition: border-color 0.3s;
  }

  #userAns:focus {
    border-color: #ffa500;
  }

  #submit {
    background-color: #444;
    color: #fff;

  }
  form{
    display:flex;
    flex-direction:column;
    align-items:center; 
    gap:50px;
  }

  #submit:hover {
    background-color: #666;
    cursor: pointer;
    transform: scale(1.05);
  }

  #feedback {
    font-size: 1rem;
    min-height: 20px;
    margin-top: 10px;
    color: #0f0;
  }
  #user{
    display:none;
  }
 
  </style>
</head>
<body>
<div class="gameBox">
  <h2>Math Fun</h2>
  
  <button class="orange-btn" id="diceBtn">🎲 Generate</button>

  <div class="problem" id="problem">Press "Generate" to start</div>

  <form onsubmit="return false;">
    <label for="userAns" id="user">Your Answer</label>
    <input type="number" id="userAns" placeholder="?" required />

    <button id="submit">✅ Submit</button>
  </form>

  <div class="feedback" id="feedback"></div>
  <div id="score"></div>
</div>


  <script>
  let generateBtn = document.getElementById("diceBtn");
  let userans = document.getElementById("problem");
  let num1 = Math.floor(Math.random() * 100) + 1;
  let num2 = Math.floor(Math.random() * 100) + 1;
  let score = document.getElementById("score");
  let correctCount = 0;
  let incorrectCount = 0;
    generateBtn.addEventListener("click", function() {
      num1 = Math.floor(Math.random() * 100) + 1;
      num2 = Math.floor(Math.random() * 100) + 1;
      userans.textContent = num1 + " and " + num2 + " = ";
    });
  let finalanswer = document.getElementById("userAns");
  let submitBtn = document.getElementById("submit");
  submitBtn.addEventListener("click", function() {
    if (finalanswer.value == num1 + num2) {
      console.log(finalanswer.value);
      document.getElementById("feedback").textContent = "✅ Correct!";
      correctCount++;
      score.textContent = "Number of correct answers ✅: " + correctCount;
    } else {
      document.getElementById("feedback").textContent = "❌ Wrong! The correct answer is:  " + (num1 + num2);
      incorrectCount++;
      score.textContent = "Number of correct answers ✅: " + correctCount + " | Number of wrong answers❌: " + incorrectCount;
    }
  });
  
  </script>
</body>
</html>
