<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Wander off the path with Nicholas Kehayias</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="reccomendations.html">Recommendations</a></li>
        <li><a href="tips.html">Tips</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Choose Your Tour</h2>
    <h3>Hover over the images to see the destination</h3>
    <div class="tour-grid">
      <a class="tour-card" href="destinations.html"><img src="images/301imgs/paros/IMG_0295.jpeg" alt="Paros"><p class="tour-title"></p></a>
      <a class="tour-card" href="destinations.html"><img src="images/301imgs/valencia/IMG_3263.JPG" alt="Valencia"><p class="tour-title"></p></a>
      <a class="tour-card" href="destinations.html"><img src="images/301imgs/washingtondc/IMG_5697.jpeg" alt="Washington"><p class="tour-title"></p></a>
      <a class="tour-card" href="destinations.html"><img src="images/301imgs/sanjuan/IMG_0007.JPG" alt="San Juan"><p class="tour-title"></p></a>
      <a class="tour-card" href="destinations.html"><img src="images/301imgs/athens/IMG_5416.jpeg" alt="Athens"><p class="tour-title"></p></a>
      <a class="tour-card" href="destinations.html"><img src="images/301imgs/nyc/IMG_1904.jpeg" alt="New York City"><p class="tour-title"></p></a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Nicholas Kehayias</p>
    <p><a href="mailto:nicholas_kehayias@outlook.com">nicholas_kehayias@outlook.com</a> |
      <a href="https://www.jmu.edu/">James Madison University</a></p>
  </footer>

  <script>
    let places = ["Paros, Greece", "Valencia, Spain", "Washington, D.C.",
      "San Juan, Puerto Rico", "Athens, Greece", "New York City"];
    let tourCards = document.querySelectorAll(".tour-card");
    for (let i = 0; i < tourCards.length; i++) {
      let title = tourCards[i].querySelector(".tour-title");
      tourCards[i].onmouseover = function() {
        title.innerHTML = places[i];
        title.style.display = "block";
      };
      tourCards[i].onmouseout = function() {
        title.style.display = "none";
      };
    }
  </script>
</body>
</html>
